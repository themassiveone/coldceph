name: ColdCeph CI

on:
  push:
    branches:
      - '**'

# Runs on main share one group and never cancel, so every commit that can release is built.
# Everywhere else the newest push wins: a branch run that a later push has already superseded
# only holds runners that the push it belongs to is waiting for.
concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main'
      && format('{0}-main-release', github.workflow)
      || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release tooling
        run: npm ci

      - name: Plan version
        id: plan
        run: node .github/scripts/plan-version.js

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and test
        run: dotnet test coldceph.slnx --configuration Release --filter "FullyQualifiedName!~ColdCeph.E2E.Tests"

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run Xcepto journeys
        run: dotnet test coldceph.slnx --configuration Release --filter "FullyQualifiedName~ColdCeph.E2E.Tests"

  release:
    name: Release
    needs: [version, test, e2e]
    if: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release tooling
        run: npm ci

      - name: Build debs
        run: packaging/linux/build-debs.sh "${{ needs.version.outputs.version }}" artifacts/debs

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
