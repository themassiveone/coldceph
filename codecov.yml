coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files, condensed_footer"
  behavior: default
  require_changes: true

github_checks:
  annotations: false

ignore:
  - "ColdCeph.Core.Tests"
  - "ColdCeph.Control.Tests"
  - "ColdCeph.Node.Tests"
  - "ColdCeph.Debug.Tests"
  - "ColdCeph.Architecture.Tests"
  - "ColdCeph.E2E.Tests"
  - "**/*_ViewStart.cshtml"
