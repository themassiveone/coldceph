# Local multi-node Ceph for ColdCeph development.
# Each service is one host. Three storage nodes, each with one ramdisk OSD.
# Fully ephemeral: no named volumes. compose down discards the cluster.
# E2E does not use this file.
x-image: &ceph-image
  image: ${CEPH_IMAGE:-quay.io/ceph/daemon:v7.0.3-stable-7.0-quincy-centos-stream8}

x-scripts: &ceph-scripts
  - ./docker/ceph:/opt/coldceph:ro

x-cluster-env: &cluster-env
  CLUSTER: ceph
  MON_IP: ${CEPH_MON_IP:-172.28.90.10}
  CEPH_PUBLIC_NETWORK: ${CEPH_PUBLIC_NETWORK:-172.28.90.0/24}
  CEPH_CONFIG_PORT: ${CEPH_CONFIG_PORT:-3799}

x-storage-node: &storage-node
  <<: *ceph-image
  privileged: true
  init: true
  entrypoint: ["/bin/bash", "/opt/coldceph/osd-node-entrypoint.sh"]
  environment:
    <<: *cluster-env
    CEPH_VOLUME_SKIP_RESTORECON: "1"
    OSD_SIZE_MB: ${OSD_SIZE_MB:-1024}
  volumes: *ceph-scripts
  tmpfs:
    - /etc/ceph
    - /var/lib/ceph
    - /var/run/ceph
    - /mnt/ramdisk:size=1536M
  depends_on:
    mon:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "test -s /etc/ceph/ceph.conf && grep -Eq 'running|stopped' /var/run/ceph/osd.wanted"]
    interval: 5s
    timeout: 5s
    retries: 36
    start_period: 180s
  stop_grace_period: 10s

x-cc-node: &cc-node
  build:
    context: .
    dockerfile: docker/node/Dockerfile
  working_dir: /src
  command:
    [
      "dotnet",
      "run",
      "--no-launch-profile",
      "--project",
      "ColdCeph.Node",
      "--property:BaseIntermediateOutputPath=/tmp/cc-obj/",
      "--property:BaseOutputPath=/tmp/cc-bin/",
    ]
  init: true
  network_mode: host
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_HTTP_PORTS: ""
    ASPNETCORE_HTTPS_PORTS: ""
    COLDCEPH_NODE_TOKEN: ${COLDCEPH_NODE_TOKEN:-changeme}
    COLDCEPH_CONTROL_ENDPOINT: ${COLDCEPH_CONTROL_ENDPOINT:-http://127.0.0.1:${WEB_PORT:-8080}}
    COLDCEPH_NODE_DATA: /tmp/coldceph-node
    DOTNET_CLI_HOME: /tmp/dotnet
    NUGET_PACKAGES: /tmp/nuget
  volumes:
    - .:/src:ro
    - /var/run/docker.sock:/var/run/docker.sock
  tmpfs:
    - /tmp:exec
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://127.0.0.1:$$NODE_PORT/health"]
    interval: 5s
    timeout: 5s
    retries: 36
    start_period: 180s
  stop_grace_period: 10s

services:
  mon:
    <<: *ceph-image
    container_name: ${CEPH_MON_CONTAINER:-coldceph-mon}
    hostname: mon
    init: true
    entrypoint: ["/bin/bash", "/opt/coldceph/mon-entrypoint.sh"]
    environment:
      <<: *cluster-env
      CEPH_DAEMON: MON
      NETWORK_AUTO_DETECT: 0
      CEPH_DASHBOARD: ${CEPH_DASHBOARD:-0}
    ports:
      - "${MON_HOST_PORT:-3300}:3300"
    networks:
      default:
        ipv4_address: ${CEPH_MON_IP:-172.28.90.10}
    volumes: *ceph-scripts
    tmpfs:
      - /etc/ceph
      - /var/lib/ceph
      - /var/run/ceph
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ceph -s >/dev/null && curl -sf http://127.0.0.1:${CEPH_CONFIG_PORT:-3799}/bootstrap-osd.keyring | grep -q client",
        ]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 45s
    stop_grace_period: 10s

  mgr:
    <<: *ceph-image
    container_name: ${CEPH_MGR_CONTAINER:-coldceph-mgr}
    hostname: mgr
    init: true
    entrypoint: ["/bin/bash", "/opt/coldceph/mgr-entrypoint.sh"]
    environment:
      <<: *cluster-env
      CEPH_DAEMON: MGR
      CEPH_DASHBOARD: ${CEPH_DASHBOARD:-0}
    networks:
      default:
        ipv4_address: ${CEPH_MGR_IP:-172.28.90.11}
    volumes: *ceph-scripts
    tmpfs:
      - /etc/ceph
      - /var/lib/ceph
      - /var/run/ceph
    depends_on:
      mon:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x ceph-mgr >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 45s
    stop_grace_period: 10s

  node-a:
    <<: *storage-node
    container_name: ${CEPH_NODE_A_CONTAINER:-coldceph-node-a}
    hostname: node-a
    networks:
      default:
        ipv4_address: ${CEPH_NODE_A_IP:-172.28.90.21}

  node-b:
    <<: *storage-node
    container_name: ${CEPH_NODE_B_CONTAINER:-coldceph-node-b}
    hostname: node-b
    networks:
      default:
        ipv4_address: ${CEPH_NODE_B_IP:-172.28.90.22}

  node-c:
    <<: *storage-node
    container_name: ${CEPH_NODE_C_CONTAINER:-coldceph-node-c}
    hostname: node-c
    networks:
      default:
        ipv4_address: ${CEPH_NODE_C_IP:-172.28.90.23}

  rgw:
    <<: *ceph-image
    container_name: ${CEPH_RGW_CONTAINER:-coldceph-rgw}
    hostname: rgw
    init: true
    entrypoint: ["/bin/bash", "/opt/coldceph/rgw-entrypoint.sh"]
    environment:
      <<: *cluster-env
      CEPH_DAEMON: RGW
      RGW_CIVETWEB_PORT: "7480"
      RGW_FRONTEND: "beast port=7480"
      RGW_NAME: ${RGW_NAME:-localhost}
      CEPH_DEMO_UID: ${CEPH_DEMO_UID:-coldceph}
      CEPH_DEMO_ACCESS_KEY: ${CEPH_DEMO_ACCESS_KEY:-coldceph}
      CEPH_DEMO_SECRET_KEY: ${CEPH_DEMO_SECRET_KEY:-coldcephsecret}
    ports:
      - "${RGW_HOST_PORT:-7481}:7480"
    networks:
      default:
        ipv4_address: ${CEPH_RGW_IP:-172.28.90.30}
    volumes: *ceph-scripts
    tmpfs:
      - /etc/ceph
      - /var/lib/ceph
      - /var/run/ceph
    depends_on:
      node-a:
        condition: service_healthy
      node-b:
        condition: service_healthy
      node-c:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 3 http://127.0.0.1:7480/"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 90s
    stop_grace_period: 10s

  cc-a:
    <<: *cc-node
    container_name: ${COLDCEPH_CC_A_CONTAINER:-coldceph-cc-a}
    hostname: cc-a
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORTS: ""
      NODE_PORT: "${NODE_A_HOST_PORT:-7081}"
      COLDCEPH_NODE_TOKEN: ${COLDCEPH_NODE_TOKEN:-changeme}
      COLDCEPH_HOST_ID: node-a
      COLDCEPH_HOSTNAME: node-a
      COLDCEPH_CONTROL_ENDPOINT: ${COLDCEPH_CONTROL_ENDPOINT:-http://127.0.0.1:${WEB_PORT:-8080}}
      COLDCEPH_ADVERTISE_URL: http://127.0.0.1:${NODE_A_HOST_PORT:-7081}
      COLDCEPH_OSD_CONTAINER: ${CEPH_NODE_A_CONTAINER:-coldceph-node-a}
      COLDCEPH_NODE_DATA: /tmp/coldceph-node
      DOTNET_CLI_HOME: /tmp/dotnet
      NUGET_PACKAGES: /tmp/nuget
    depends_on:
      node-a:
        condition: service_healthy

  cc-b:
    <<: *cc-node
    container_name: ${COLDCEPH_CC_B_CONTAINER:-coldceph-cc-b}
    hostname: cc-b
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORTS: ""
      NODE_PORT: "${NODE_B_HOST_PORT:-7082}"
      COLDCEPH_NODE_TOKEN: ${COLDCEPH_NODE_TOKEN:-changeme}
      COLDCEPH_HOST_ID: node-b
      COLDCEPH_HOSTNAME: node-b
      COLDCEPH_CONTROL_ENDPOINT: ${COLDCEPH_CONTROL_ENDPOINT:-http://127.0.0.1:${WEB_PORT:-8080}}
      COLDCEPH_ADVERTISE_URL: http://127.0.0.1:${NODE_B_HOST_PORT:-7082}
      COLDCEPH_OSD_CONTAINER: ${CEPH_NODE_B_CONTAINER:-coldceph-node-b}
      COLDCEPH_NODE_DATA: /tmp/coldceph-node
      DOTNET_CLI_HOME: /tmp/dotnet
      NUGET_PACKAGES: /tmp/nuget
    depends_on:
      node-b:
        condition: service_healthy

  cc-c:
    <<: *cc-node
    container_name: ${COLDCEPH_CC_C_CONTAINER:-coldceph-cc-c}
    hostname: cc-c
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORTS: ""
      NODE_PORT: "${NODE_C_HOST_PORT:-7083}"
      COLDCEPH_NODE_TOKEN: ${COLDCEPH_NODE_TOKEN:-changeme}
      COLDCEPH_HOST_ID: node-c
      COLDCEPH_HOSTNAME: node-c
      COLDCEPH_CONTROL_ENDPOINT: ${COLDCEPH_CONTROL_ENDPOINT:-http://127.0.0.1:${WEB_PORT:-8080}}
      COLDCEPH_ADVERTISE_URL: http://127.0.0.1:${NODE_C_HOST_PORT:-7083}
      COLDCEPH_OSD_CONTAINER: ${CEPH_NODE_C_CONTAINER:-coldceph-node-c}
      COLDCEPH_NODE_DATA: /tmp/coldceph-node
      DOTNET_CLI_HOME: /tmp/dotnet
      NUGET_PACKAGES: /tmp/nuget
    depends_on:
      node-c:
        condition: service_healthy

networks:
  default:
    name: ${CEPH_NETWORK_NAME:-coldceph_ceph}
    ipam:
      config:
        - subnet: ${CEPH_PUBLIC_NETWORK:-172.28.90.0/24}
